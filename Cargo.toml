[package]
name = "uec-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "=0.8.4"
tokio = { version = "=1.45.1", features = ["full"] }
tower-http = { version = "=0.6.6", features = ["cors", "compression-br", "fs"] }
serde = { version = "=1.0.219", features = ["derive"] }
csv = "=1.3.1"
include_dir = "=0.7.4"
once_cell = "=1.21.3"
tokio-postgres = { version = "=0.7.13", features = ["with-uuid-1", "with-chrono-0_4"] }
deadpool-postgres = { version = "=0.14.1" }
tokio-postgres-rustls = { version = "=0.14.0", features = ["webpki-roots", "ring"] }
rustls = { version = "=0.23.29", features = ["ring"] }
futures-util = "=0.3.31"
chrono = { version = "=0.4.41", features = ["serde"] }
uuid = { version = "=1.18.1", features = ["serde"] }
tower = { version = "=0.5.2", features = ["util"] }

reqwest = { version = "=0.12.24", features = ["json", "rustls-tls"], default-features = false }
serde_json = "=1.0.140"

# Shuttle dependencies
serde-xml-rs = "0.8.1"
