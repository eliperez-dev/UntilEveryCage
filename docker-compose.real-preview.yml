services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: uec
      POSTGRES_USER: uec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?a random password is required}
    healthcheck:
      test: ["CMD-SHELL", "psql -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -c \"SELECT 1\" >/dev/null 2>&1"]
      interval: 1s
      timeout: 5s
      retries: 60
      start_period: 10s
    ports:
      - "127.0.0.1:${UEC_REAL_PREVIEW_DB_PORT:-55433}:5432"
    volumes:
      - uec-real-preview-e2e-source-postgres:/var/lib/postgresql/data
volumes:
  uec-real-preview-e2e-source-postgres:
    name: uec-real-preview-e2e-source-postgres
