name: Tests

on:
  push:
  pull_request:

jobs:
  standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install psycopg[binary]
      - name: Run standard tests in the canonical clean environment
        shell: pwsh
        run: ./pipeline/tests/run-standard.ps1

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install psycopg[binary]
      - name: Run Docker-backed API E2E tests
        env:
          UEC_RUN_E2E: '1'
        run: |
          python -m unittest pipeline.tests.e2e.test_public_api -v
          python -m unittest pipeline.tests.e2e.test_community_api -v
          python -m unittest pipeline.tests.e2e.test_seeded_api -v
          python -m unittest pipeline.tests.e2e.test_public_surface_safety -v

  backup-restore:
    # The PostGIS image is Linux-only; Ubuntu includes PowerShell Core for the drill.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run synthetic backup/restore gate
        shell: pwsh
        env:
          UEC_RUN_E2E: '1'
        run: ./pipeline/tests/e2e/backup-restore.ps1

  static-jest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test

  v2-gate-self-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check V2 gate failure and success reporting
        shell: pwsh
        run: ./pipeline/tests/test-v2-gate.ps1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run lint
      - run: npm run boundary
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test tests/e2e/fixture-platform.spec.ts tests/e2e/local-safety.spec.ts --project=chromium --project=firefox --project=webkit --workers=2
