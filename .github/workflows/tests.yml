name: Tests

on:
  push:
  pull_request:

jobs:
  standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r pipeline/requirements.txt
      - name: Run standard tests in the canonical clean environment
        shell: pwsh
        run: ./pipeline/tests/run-standard.ps1

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r pipeline/requirements.txt
      - name: Verify private Docker build context
        shell: pwsh
        run: ./pipeline/tests/verify-docker-context.ps1
      - name: Run Docker-backed API E2E tests (core and extended)
        shell: pwsh
        run: ./pipeline/tests/e2e/run-suite.ps1 -Suite full

  backup-restore:
    # The PostGIS image is Linux-only; Ubuntu includes PowerShell Core for the drill.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r pipeline/requirements.txt
      - name: Run synthetic backup/restore gate
        shell: pwsh
        env:
          UEC_RUN_E2E: '1'
        run: ./pipeline/tests/e2e/backup-restore.ps1

  static-jest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test

  v2-gate-self-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check V2 gate failure and success reporting
        shell: pwsh
        run: ./pipeline/tests/test-v2-gate.ps1

  frontend:
    runs-on: ubuntu-latest
    # Keep this image aligned with the Playwright version in frontend/package-lock.json.
    # Browsers and OS dependencies are preinstalled; avoid a fresh apt mirror download.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:bc6ab0d6d44ff4826e4cb8c1e6d801e185bfc42bb0753f8e2a30efc70db054c7
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run lint
      - run: npm run boundary
      - run: npm run build
      - name: Align container home ownership for Firefox
        shell: bash
        run: chown "$(id -u):$(id -g)" /github/home
      - run: npx playwright test tests/e2e/shell-routes.spec.ts tests/e2e/local-safety.spec.ts tests/e2e/private-preview.spec.ts tests/e2e/cold-root-map.spec.ts --project=chromium --project=firefox --project=webkit --workers=2
      - name: Facility detail browser regressions (synthetic projections)
        run: npx playwright test tests/e2e/facility-detail-presentation.spec.ts --project=chromium --workers=1
      - name: Map and launch browsing regressions (synthetic projections)
        run: npx playwright test tests/e2e/map-camera.spec.ts tests/e2e/public-database-parallel-facets.spec.ts tests/e2e/nav-hover.spec.ts tests/e2e/public-api-help.spec.ts --project=chromium --workers=1
      - name: Community pilot browser proof (synthetic only)
        env:
          VITE_COMMUNITY_PILOT: 'true'
        run: npx playwright test tests/e2e/community-pilot.spec.ts --project=chromium --workers=1

  container-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the locked production container
        shell: bash
        run: |
          set +e
          docker build --pull=false --tag uec-api-package:${{ github.sha }} . 2>&1 | tee /tmp/uec-container-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary=$(grep -Ei 'error:|failed to|failed|error \[' /tmp/uec-container-build.log | tail -n 1 | sed -E 's#https?://[^ ]+#<url>#g; s/[^[:print:]]//g' | cut -c1-240)
            : "${summary:=container build exited nonzero without a classified compiler or build error}"
            echo "::error title=container package failed::$summary"
            exit "$status"
          fi
      - name: Smoke the packaged public boundary
        run: >-
          docker run --rm --entrypoint sh uec-api-package:${{ github.sha }} -c
          'test -x /usr/local/bin/uec-api && test -f /app/static/index.html && ! test -e /app/data && ! test -e /app/static/node_modules'
