name: Tests

on:
  push:
  pull_request:

jobs:
  standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install psycopg[binary]
      - name: Start PostGIS for database-backed tests
        run: docker compose -f docker-compose.pipeline.yml up -d
      - run: cargo test --locked
      - run: python -m unittest discover -s pipeline/tests -q
      - name: Stop PostGIS
        if: always()
        run: docker compose -f docker-compose.pipeline.yml down -v

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install psycopg[binary]
      - name: Run Docker-backed API E2E tests
        env:
          UEC_RUN_E2E: '1'
        run: python -m unittest discover -s pipeline/tests/e2e -p 'test_*.py' -v
